spring.application.name=tour

# Flatten Pageable/Sort parameters in Swagger UI so they are editable individually.
springdoc.default-flat-param-object=true
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tour}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Read cache (Redis). Set SPRING_CACHE_TYPE=none to disable caching.
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.cache.redis.time-to-live=${SPRING_CACHE_TTL:PT10M}
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=tour:
spring.cache.redis.use-key-prefix=true

# Short Redis timeouts keep a down cache from stalling requests.
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:1s}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration,classpath:db/callback
# The shared schema predates Flyway; baseline at 0 so V1 still runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Auth
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=PT15M
app.auth.refresh-token-ttl=P7D
app.auth.password-reset-token-ttl=PT30M
app.auth.email-verification-token-ttl=P2D
app.auth.cookie-secure=${APP_COOKIE_SECURE:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Mail (leave SPRING_MAIL_HOST/MAIL_HOST empty to disable sending safely)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:${MAIL_SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:${MAIL_SMTP_STARTTLS:true}}
# UTF-8 keeps Vietnamese subjects/bodies intact (Boot also defaults to UTF-8).
spring.mail.default-encoding=UTF-8
# Fail fast instead of hanging a mail worker on a blocked SMTP port (5000-10000 ms).
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITETIMEOUT:5000}
app.mail.from=${MAIL_FROM:no-reply@tour.local}
app.web.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.security.trust-proxy=${APP_TRUST_PROXY:false}

# Payment callbacks (HMAC-SHA256). Leave empty in non-payment deployments: callbacks fail closed.
app.payment.callback-secret=${PAYMENT_CALLBACK_SECRET:}

# Demo card payment. Disabled by default; enable only for demos and local testing.
app.payment.mock-enabled=${PAYMENT_MOCK_ENABLED:false}

management.endpoints.web.exposure.include=health
