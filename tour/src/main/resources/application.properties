spring.application.name=tour
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration,classpath:db/callback
# The shared schema predates Flyway; baseline at 0 so V1 still runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Auth
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=PT15M
app.auth.refresh-token-ttl=P7D
app.auth.cookie-secure=${APP_COOKIE_SECURE:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.security.trust-proxy=${APP_TRUST_PROXY:false}

management.endpoints.web.exposure.include=health
