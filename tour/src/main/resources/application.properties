spring.application.name=tour

# Flatten Pageable/Sort parameters in Swagger UI so they are editable individually.
springdoc.default-flat-param-object=true
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tour}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration,classpath:db/callback
# The shared schema predates Flyway; baseline at 0 so V1 still runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Auth
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl=PT15M
app.auth.refresh-token-ttl=P7D
app.auth.password-reset-token-ttl=PT30M
app.auth.email-verification-token-ttl=P2D
app.auth.cookie-secure=${APP_COOKIE_SECURE:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Mail (leave SPRING_MAIL_HOST/MAIL_HOST empty to disable sending safely)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:${MAIL_SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:${MAIL_SMTP_STARTTLS:true}}
app.mail.from=${MAIL_FROM:no-reply@tour.local}
app.web.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.security.trust-proxy=${APP_TRUST_PROXY:false}

# Payment callbacks (HMAC-SHA256). Leave empty in non-payment deployments: callbacks fail closed.
app.payment.callback-secret=${PAYMENT_CALLBACK_SECRET:}

management.endpoints.web.exposure.include=health
